[package]
name = "mcp-multiplexer"
version = "0.2.1"
edition = "2024"
description = "One MCP server fronting many: 7 meta-tools instead of every tool schema in context"
license = "MIT"
repository = "https://github.com/johgirard/mcp-multiplexer"
default-run = "mcp-multiplexer"
keywords = ["mcp", "mcp-server", "claude", "multiplexer", "proxy"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
clap = { version = "4.6.6", features = ["derive"] }
http = "1"
rmcp = { version = "3.2", features = ["client", "server", "macros", "auth", "reqwest", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }  # "reqwest" feature = rustls; without it ALL https upstreams fail ("scheme is not http")
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
