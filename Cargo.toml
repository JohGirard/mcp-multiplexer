[package]
name = "mcp-multiplexer"
version = "0.1.0"
edition = "2024"
description = "One MCP server fronting many: 5 meta-tools instead of every tool schema in context"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johgirard/mcp-multiplexer"
keywords = ["mcp", "model-context-protocol", "claude", "aggregator", "proxy"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
http = "1"
rmcp = { version = "3.2", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
